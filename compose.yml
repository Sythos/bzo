services:
  bzo:
    image: ghcr.io/timriker/bzo:latest
    restart: unless-stopped
    ports:
      # The one port: TCP for the web app and BZFlag clients, UDP for
      # BZFlag, WebTransport and WebRTC.
      - "5154:5154/tcp"
      - "5154:5154/udp"
    environment:
      SERVER_CONFIG_PATH: /data/server.json
    volumes:
      - ./data:/data
